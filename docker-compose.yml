version: "2.4"

# Legacy Compose format, matching ascend-llm. No BuildKit/Compose V2 features.
services:
  pipeline:
    image: sam3-llm-pipeline:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: "${PIPELINE_BASE_IMAGE}"
        PIP_INDEX_URL: "${PIP_INDEX_URL}"
    container_name: sam3-llm-pipeline
    restart: unless-stopped
    # ascend-llm listens on the server's 127.0.0.1:8080.
    network_mode: host
    env_file:
      - .env
    environment:
      PIPELINE_DATA_DIR: /data/events
      PIPELINE_LOG_DIR: /data/logs
    volumes:
      - "${PIPELINE_STORAGE_DIR}:/data/events"
      - "./data/logs:/data/logs"
    stop_grace_period: 60s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PIPELINE_PORT', '18080') + '/health', timeout=5)
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 15s
    # File logs are the only persistent copy, with a maximum age of 30 days.
    logging:
      driver: "none"
